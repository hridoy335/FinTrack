services:
  db:
    image: postgres:16
    container_name: fintrack-db
    environment:
      POSTGRES_DB: fintrackcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5432:5432"
    volumes:
      - fintrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintrackcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # CI pushes this image on push to main/develop (see .github/workflows/build.yml)
    image: hridoy335/fintrack:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack-api
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5027:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Override connection string for Docker network hostname "db"
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=fintrackcore;Username=postgres;Password=12345
      Jwt__Key: FinTrackCore_Dev_Secret_Key_Change_In_Production_123456
      Jwt__Issuer: FinTrackCore
      Jwt__Audience: FinTrackCore
      Cors__AllowedOrigins__0: http://localhost:4200

volumes:
  fintrack_pgdata: