<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack — Chart of Accounts</title>
  <style>
    :root {
      --primary: #1565c0;
      --surface: #fafafa;
      --card: #ffffff;
      --border: #e0e0e0;
      --text: #212121;
      --muted: #757575;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--surface);
      color: var(--text);
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 { font-size: 1.5rem; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .section-title {
      padding: 12px 16px;
      background: #e3f2fd;
      color: var(--primary);
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      background: #fcfcfc;
    }

    tr:last-child td { border-bottom: none; }

    .badge {
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Chart of Accounts</h1>
      <p style="color: var(--muted); margin-top: 4px;">Code | Account Head Name</p>
    </div>
    <button class="btn" id="printBtn">Download PDF</button>
  </div>

  <div id="content"></div>

  <script>
    const API_BASE = "http://localhost:5027";
    const token = localStorage.getItem("accessToken");

    async function loadList() {
      const response = await fetch(`${API_BASE}/api/Coas/list`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const json = await response.json();
      render(json.data);
    }

    function render(data) {
      const root = document.getElementById("content");
      root.innerHTML = "";

      for (const section of data.sections) {
        const block = document.createElement("div");
        block.className = "section";
        block.innerHTML = `
          <div class="section-title">${section.accountTypeName}</div>
          <table>
            <thead>
              <tr>
                <th style="width:120px">Code</th>
                <th>Account Head Name</th>
                <th style="width:100px">Status</th>
              </tr>
            </thead>
            <tbody>
              ${section.items.map(item => `
                <tr>
                  <td>${item.code}</td>
                  <td>${item.accountHeadName}</td>
                  <td><span class="badge">${item.isSystemDefault ? "Default" : item.isActive ? "Active" : "Inactive"}</span></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
        root.appendChild(block);
      }
    }

    document.getElementById("printBtn").addEventListener("click", async () => {
      const response = await fetch(`${API_BASE}/api/Coas/export/pdf`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "chart-of-accounts.pdf";
      link.click();
      URL.revokeObjectURL(url);
    });

    if (token) {
      loadList().catch(console.error);
    }
  </script>
</body>
</html>
